name: Atualizar fila de research

# Roda de hora em hora (nos dias úteis, no horário comercial de Brasília) e
# também sob demanda pelo botão "Run workflow" no GitHub.
on:
  schedule:
    # cron é em UTC. 11:00–23:00 UTC ≈ 08:00–20:00 em Brasília (UTC-3).
    - cron: '0 11-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Raspar o Genial Analisa
        run: node scraper/scrape.mjs --limit 12 --out ../reports.json

      - name: Commitar se houve mudança
        run: |
          if git diff --quiet -- reports.json; then
            echo "Nenhum relatório novo — nada a fazer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json
          git commit -m "chore: atualiza fila de research ($(date -u +%d/%m\ %H:%M) UTC)"
          git push